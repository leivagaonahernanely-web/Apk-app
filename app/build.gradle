plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leivagaonahernanely.robloxhelper'
    compileSdk 34

    defaultConfig {
        applicationId "com.leivagaonahernanely.robloxhelper"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Sin dependencias externas: solo usa el SDK de Android.

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
